
name: Build Shooter3D APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted

      - name: Install dependencies
        working-directory: extracted/Shooter3D
        run: npm install

      - name: Add Android
        working-directory: extracted/Shooter3D
        run: npx cap add android

      - name: Sync Android
        working-directory: extracted/Shooter3D
        run: npx cap sync android

      - name: Build APK
        working-directory: extracted/Shooter3D/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shooter3D-APK
          path: extracted/Shooter3D/android/app/build/outputs/apk/debug/app-debug.apk
